services:
  postgres:
    image: postgres:alpine
    container_name: ticket-api-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ticket_api}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticket-api-network

networks:
  ticket-api-network:
    driver: bridge
